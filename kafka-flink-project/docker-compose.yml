version: '3.8'

services:
  # ZooKeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - flink-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - flink-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - flink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Flink JobManager
  jobmanager:
    image: flink:1.17.1-scala_2.12-java11
    container_name: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4
      - FLINK_ENV_JAVA_OPTS=-XX:+UseG1GC
    volumes:
      - ./flink:/opt/flink/usrlib
      - ./flink-java/target:/opt/flink/usrlib/java
      - flink-checkpoints:/opt/flink/flink-checkpoints
      - ./flink/jars:/opt/flink/usrlib/jars
    networks:
      - flink-network
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Flink TaskManager
  taskmanager:
    image: flink:1.17.1-scala_2.12-java11
    container_name: taskmanager
    command: taskmanager
    scale: 1
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4
      - FLINK_ENV_JAVA_OPTS=-XX:+UseG1GC
    volumes:
      - ./flink:/opt/flink/usrlib
      - ./flink-java/target:/opt/flink/usrlib/java
      - flink-checkpoints:/opt/flink/flink-checkpoints
      - ./flink/jars:/opt/flink/usrlib/jars
    networks:
      - flink-network
    depends_on:
      - jobmanager

  # Build service to compile Java Flink job
  flink-java-build:
    image: maven:3.9.5-eclipse-temurin-11
    container_name: flink-java-build
    working_dir: /app
    volumes:
      - ./flink-java:/app
    command: mvn package -DskipTests

  # Java Flink Job submitter (optional)
  flink-java-job:
    build:
      context: ./flink-java
      dockerfile: Dockerfile
    container_name: flink-java-job
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: >
      flink run -m jobmanager:8081 -c com.flink.orderprocessor.OrderProcessor /opt/flink/usrlib/flink-order-processor.jar -d
    networks:
      - flink-network
    depends_on:
      jobmanager:
        condition: service_started
      taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # PySpark Streaming Job
  spark-job:
    image: apache/spark:3.5.1
    container_name: spark-job
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/orders_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./spark:/app
    command: >
      /opt/spark/bin/spark-submit
      --master local[*] 
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.6.0
      /app/process_orders.py
    networks:
      - flink-network
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Kafka Producer (optional - can run locally)
  producer:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./producer:/app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BATCH_SIZE: 5
      INTERVAL: 2
    command: >
      bash -c "pip install kafka-python && python /app/generator.py"
    networks:
      - flink-network
    depends_on:
      kafka:
        condition: service_healthy

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPERCONNECT: zookeeper:2181
    networks:
      - flink-network
    depends_on:
      kafka:
        condition: service_healthy

networks:
  flink-network:
    driver: bridge

volumes:
  postgres-data:
  flink-checkpoints:
